<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Lubricantes</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d47a1">
      
<style>
body { font-family: Arial; margin: 0; padding: 10px; background:#f5f5f5;}
header { background:#0d47a1; color:white; padding:15px; text-align:center; font-size:18px;}

table { border-collapse: collapse; width: 100%; background:white; }
th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
th { background: #1976d2; color:white; }

input[type=number] {
    width: 55px;
    height: 35px;
    font-size: 16px;
    text-align: center;
}

button {
    width: 48%;
    padding: 12px;
    margin: 5px 1%;
    font-size: 14px;
}

.total { font-weight: bold; background: #e8f5e9; }
</style>
</head>

<body>

<header>📊 Inventario de Aceites y Lubricantes - MegaGas</header>

Estación: <input type="text" id="estacion"><br><br>

<table id="tabla">
<thead>
<tr>
<th>Producto</th>
<th>Bodega</th>
<th>1</th>
<th>2</th>
<th>3</th>
<th>4</th>
<th>A</th>
<th>B</th>
<th>Total</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button onclick="guardar()">💾 Guardar</button>
<button onclick="exportar()">📤 Exportar</button>
<button onclick="enviarCorreo()">📧 Enviar</button>
<button onclick="limpiarTodo()">🗑 Limpiar</button>
<button onclick="verHistorial()">📊 Historial</button>
<script>

// PRODUCTOS
const productos = [
"LIMPIA PARABRISAS FULL PRO 200 ML","LIMPIA PARABRISAS FULLPRO .946 ML","DIRECCION HIDRAULICA 200 ML","LIQUIDO DE FRENOS 200 ML","ANTICONGELANTE IDEAL .946 ML","ANTICONGELANTE  IDEAL 3.79 ML","ANTICONGELANTE  OPTIMA .946 ML","ANTICONGELANTE  OPTIMA 3.79 L","QS SERIES III SAE 50 .946 ML","QS SERIES III SAE 50 5 LT","QS MAX VISCOSIDAD SAE 25W/50 CF4 .946 ML","QS MAX VISCOSIDAD SEA 25W/50 CF4 5 LT","HELIX HX3 HM25W60 SL_A1W9","HELIX HX5 SN 20W50 _A1W9","HHELIX HX7 SN 10W40 SN_A1W9","HLX HX7 SN PLUS 10W30 SN_LATA","HLX HX8 PRO AG5W30 DEX1_LATA","FULL PRO ARRANCADOR SPRAY 400 ML","QS ALTO KILOMETRAJE SAE 15W40 API SN","QS DEXTRONATF III","QS LIMPIADOR DE INYECTORES (XTREME GAS)","QS POWER RIDER 2T J-FB","QS SERIES III SAE 40","QS RACING MULT. SAE 20W50","QS HD SAE 40","ADVANCE AX 5 MOTOS 20 .946 ML","SHELL ADVAN 4TUL MOTOS SAE 15W-50 SN","BIDON UREA ULTRA BLUE 20 LTS",
];

// CREAR TABLA
function crearTabla() {
    let tbody = document.querySelector("#tabla tbody");
    tbody.innerHTML = "";

    productos.forEach((p, i) => {
        let fila = `<tr>
            <td>${p}</td>
            ${[0,1,2,3,4,5,6].map((col) =>
                `<td><input type="number" inputmode="numeric" data-row="${i}" data-col="${col}" class="val"></td>`
            ).join("")}
            <td class="total" id="total-${i}">0</td>
        </tr>`;
        tbody.innerHTML += fila;
    });

    document.querySelectorAll(".val").forEach(input => {
        input.addEventListener("change", function() {
            calcularFila.call(this);
            guardarTemporal();
            moverSiguiente(this);
        });
    });
}

// CALCULAR
function calcularFila() {
    let row = this.dataset.row;
    let inputs = document.querySelectorAll(`input[data-row='${row}']`);
    let suma = 0;
    inputs.forEach(i => suma += Number(i.value) || 0);
    document.getElementById(`total-${row}`).innerText = suma;
}

// AUTO AVANCE (FUNCIONAL EN CELULAR)
function moverSiguiente(current) {

    if (current.value === "") return;

    let row = parseInt(current.dataset.row);
    let col = parseInt(current.dataset.col);

    let siguiente = document.querySelector(`input[data-row='${row + 1}'][data-col='${col}']`);

    if (siguiente) {
        siguiente.focus();
        siguiente.select();
    }
}

// AUTOGUARDADO
function guardarTemporal() {
    let datos = [];

    productos.forEach((p, i) => {
        let inputs = document.querySelectorAll(`input[data-row='${i}']`);
        let valores = Array.from(inputs).map(i => i.value || "");
        datos.push(valores);
    });

    localStorage.setItem("capturaTemporal", JSON.stringify(datos));
}

// CARGAR DATOS
function cargarTemporal() {
    let datos = JSON.parse(localStorage.getItem("capturaTemporal") || "[]");

    datos.forEach((fila, i) => {
        fila.forEach((valor, j) => {
            let input = document.querySelectorAll(`input[data-row='${i}']`)[j];
            if (input) input.value = valor;
        });
    });

    document.querySelectorAll(".val").forEach(input => {
        input.dispatchEvent(new Event("change"));
    });
}

// GUARDAR
function guardar() {
    let estacion = document.getElementById("estacion").value;

    if (!estacion) {
        alert("Ingresa estación");
        return;
    }

    let registro = {
        fecha: new Date().toLocaleString(),
        estacion: estacion,
        productos: []
    };

    productos.forEach((p, i) => {
        let inputs = document.querySelectorAll(`input[data-row='${i}']`);
        let valores = Array.from(inputs).map(i => Number(i.value) || 0);
        let total = valores.reduce((a,b)=>a+b,0);

        registro.productos.push({
            producto: p,
            valores: valores,
            total: total
        });
    });

    let historial = JSON.parse(localStorage.getItem("inventarios") || "[]");
    historial.push(registro);

    localStorage.setItem("inventarios", JSON.stringify(historial));

    localStorage.removeItem("capturaTemporal");

    alert("Inventario guardado correctamente ✔");
}

// EXPORTAR
function exportar() {
    let data = localStorage.getItem("capturaTemporal") || "";
    let blob = new Blob([data], {type:"text/plain"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "inventario.txt";
    a.click();
}

// CORREO
function enviarCorreo() {
    let estacion = document.getElementById("estacion").value;
    window.location.href = `mailto:?subject=Inventario ${estacion}`;
}

// LIMPIAR
function limpiarTodo() {
    if (!confirm("¿Deseas borrar la captura?")) return;

    document.querySelectorAll(".val").forEach(i => i.value = "");
    document.querySelectorAll(".total").forEach(t => t.innerText = "0");

    localStorage.removeItem("capturaTemporal");
}

function verHistorial() {

    let historial = JSON.parse(localStorage.getItem("inventarios") || "[]");

    if (historial.length === 0) {
        alert("No hay inventarios guardados");
        return;
    }

    let texto = "HISTORIAL DE INVENTARIOS:\n\n";

    historial.forEach((r, i) => {
        texto += `${i+1}. ${r.estacion} - ${r.fecha}\n`;
    });

    alert(texto);
}
      
// NAVEGACIÓN VERTICAL
document.addEventListener("keydown", function(e) {

    let current = document.activeElement;
    if (!current.classList.contains("val")) return;

    let row = parseInt(current.dataset.row);
    let col = parseInt(current.dataset.col);

    if (e.key === "Enter" || e.key === "ArrowDown") {
        e.preventDefault();
        let next = document.querySelector(`input[data-row='${row + 1}'][data-col='${col}']`);
        if (next) next.focus();
    }

    if (e.key === "ArrowUp") {
        e.preventDefault();
        let prev = document.querySelector(`input[data-row='${row - 1}'][data-col='${col}']`);
        if (prev) prev.focus();
    }

});

      
// INICIO
document.addEventListener("DOMContentLoaded", function() {
    crearTabla();
    cargarTemporal();
});

</script>
    
</body>
</html>
