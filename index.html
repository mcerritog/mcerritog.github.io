<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Lubricantes</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d47a1">

<style>
body { font-family: Arial; margin: 0; padding: 10px; background:#f5f5f5;}
header { background:#0d47a1; color:white; padding:15px; text-align:center; font-size:18px;}

table { border-collapse: collapse; width: 100%; background:white; }
th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
th { background: #1976d2; color:white; }

input[type=number] {
    width: 55px;
    height: 35px;
    font-size: 16px;
    text-align: center;
}

button {
    width: 48%;
    padding: 12px;
    margin: 5px 1%;
    font-size: 14px;
}

.total { font-weight: bold; background: #e8f5e9; }
#reporte { background:white; padding:10px; margin-top:15px; }
</style>
</head>

<body>

<header>📊 Inventario de Lubricantes</header>

Estación: <input type="text" id="estacion"><br><br>

<table id="tabla">
<thead>
<tr>
<th>Producto</th>
<th>Bodega</th>
<th>1</th>
<th>2</th>
<th>3</th>
<th>4</th>
<th>A</th>
<th>B</th>
<th>Total</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div id="reporte"></div>

<button onclick="guardar()">💾 Guardar</button>
<button onclick="exportar()">📤 Exportar</button>
<button onclick="enviarCorreo()">📧 Enviar</button>
<button onclick="limpiarTodo()">🗑 Limpiar</button>
<button onclick="verHistorialDetalle()">📊 Ver Inventarios</button>
<button onclick="abrirCalculadora()">🧮 Calculadora</button>

<!-- 🧮 CALCULADORA -->
<div id="calcVentana" style="display:none; position:fixed; top:100px; left:50px; width:260px; background:white; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.3); z-index:9999;">

<div id="calcHeader" style="background:#0d47a1; color:white; padding:10px; cursor:move;">
🧮 Calculadora
<span style="float:right; cursor:pointer;" onclick="cerrarCalculadora()">✖</span>
</div>

<input type="text" id="calcDisplay" readonly style="width:100%; height:50px; font-size:20px; text-align:right; border:none; padding:10px;">

<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:5px; padding:10px;">

<button onclick="limpiarCalc()">C</button>
<button onclick="borrarUltimo()">⌫</button>
<button onclick="calc('%')">%</button>
<button onclick="calc('/')">÷</button>

<button onclick="calc('7')">7</button>
<button onclick="calc('8')">8</button>
<button onclick="calc('9')">9</button>
<button onclick="calc('*')">×</button>

<button onclick="calc('4')">4</button>
<button onclick="calc('5')">5</button>
<button onclick="calc('6')">6</button>
<button onclick="calc('-')">-</button>

<button onclick="calc('1')">1</button>
<button onclick="calc('2')">2</button>
<button onclick="calc('3')">3</button>
<button onclick="calc('+')">+</button>

<button onclick="calc('0')">0</button>
<button onclick="calc('.')">.</button>
<button onclick="calcularResultado()">=</button>
<button onclick="insertarResultado()">✔</button>

</div>

</div>

<script>

// PRODUCTOS
const productos = [
"LIMPIA PARABRISAS FULL PRO 200 ML","LIMPIA PARABRISAS FULLPRO .946 ML","DIRECCION HIDRAULICA 200 ML","LIQUIDO DE FRENOS 200 ML","ANTICONGELANTE IDEAL .946 ML","ANTICONGELANTE  IDEAL 3.79 ML","ANTICONGELANTE  OPTIMA .946 ML","ANTICONGELANTE  OPTIMA 3.79 L","QS SERIES III SAE 50 .946 ML","QS SERIES III SAE 50 5 LT","QS MAX VISCOSIDAD SAE 25W/50 CF4 .946 ML","QS MAX VISCOSIDAD SEA 25W/50 CF4 5 LT","HELIX HX3 HM25W60 SL_A1W9","HELIX HX5 SN 20W50 _A1W9","HHELIX HX7 SN 10W40 SN_A1W9","HLX HX7 SN PLUS 10W30 SN_LATA","HLX HX8 PRO AG5W30 DEX1_LATA","FULL PRO ARRANCADOR SPRAY 400 ML","QS ALTO KILOMETRAJE SAE 15W40 API SN","QS DEXTRONATF III","QS LIMPIADOR DE INYECTORES (XTREME GAS)","QS POWER RIDER 2T J-FB","QS SERIES III SAE 40","QS RACING MULT. SAE 20W50","QS HD SAE 40","ADVANCE AX 5 MOTOS 20 .946 ML","SHELL ADVAN 4TUL MOTOS SAE 15W-50 SN","BIDON UREA ULTRA BLUE 20 LTS"
];

// CREAR TABLA
function crearTabla() {
    let tbody = document.querySelector("#tabla tbody");
    tbody.innerHTML = "";

    productos.forEach((p, i) => {
        let fila = `<tr>
            <td>${p}</td>
            ${[0,1,2,3,4,5,6].map(col =>
                `<td><input type="number" inputmode="numeric" data-row="${i}" data-col="${col}" class="val"></td>`
            ).join("")}
            <td class="total" id="total-${i}">0</td>
        </tr>`;
        tbody.innerHTML += fila;
    });

    document.querySelectorAll(".val").forEach(input => {
        input.addEventListener("change", function() {
            calcularFila.call(this);
            guardarTemporal();
            moverSiguiente(this);
        });
    });
}

// CALCULAR
function calcularFila() {
    let row = this.dataset.row;
    let inputs = document.querySelectorAll(`input[data-row='${row}']`);
    let suma = 0;
    inputs.forEach(i => suma += Number(i.value) || 0);
    document.getElementById(`total-${row}`).innerText = suma;
}

// AUTO AVANCE
function moverSiguiente(current) {
    if (!current.value) return;
    let next = document.querySelector(`input[data-row='${+current.dataset.row+1}'][data-col='${current.dataset.col}']`);
    if (next) next.focus();
}

// AUTOGUARDADO
function guardarTemporal() {
    let datos = productos.map((_, i) =>
        Array.from(document.querySelectorAll(`input[data-row='${i}']`)).map(i => i.value || "")
    );
    localStorage.setItem("capturaTemporal", JSON.stringify(datos));
}

// CARGAR
function cargarTemporal() {
    let datos = JSON.parse(localStorage.getItem("capturaTemporal") || "[]");
    datos.forEach((fila,i)=>{
        fila.forEach((v,j)=>{
            let inp=document.querySelectorAll(`input[data-row='${i}']`)[j];
            if(inp) inp.value=v;
        });
    });
    document.querySelectorAll(".val").forEach(i=>i.dispatchEvent(new Event("change")));
}

// GUARDAR
function guardar() {
    let estacion = document.getElementById("estacion").value;
    if (!estacion) return alert("Ingresa estación");

    let registro = {
        fecha: new Date().toLocaleString(),
        estacion,
        productos: productos.map((p,i)=>{
            let vals = Array.from(document.querySelectorAll(`input[data-row='${i}']`)).map(i=>Number(i.value)||0);
            return { producto:p, valores:vals, total:vals.reduce((a,b)=>a+b,0) };
        })
    };

    let historial = JSON.parse(localStorage.getItem("inventarios") || "[]");
    historial.push(registro);
    localStorage.setItem("inventarios", JSON.stringify(historial));

    localStorage.removeItem("capturaTemporal");
    alert("Guardado ✔");
}

// EXPORTAR
function exportar() {
    let blob=new Blob([localStorage.getItem("inventarios")||""],{type:"text/plain"});
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="inventarios.txt";
    a.click();
}

// CORREO
function enviarCorreo() {
    window.location.href=`mailto:?subject=Inventario ${document.getElementById("estacion").value}`;
}

// LIMPIAR
function limpiarTodo() {
    if(!confirm("¿Borrar captura?")) return;
    document.querySelectorAll(".val").forEach(i=>i.value="");
    document.querySelectorAll(".total").forEach(t=>t.innerText="0");
    localStorage.removeItem("capturaTemporal");
}

// HISTORIAL
function verHistorialDetalle(){
let h=JSON.parse(localStorage.getItem("inventarios")||"[]");
if(!h.length) return alert("Sin datos");
let lista=h.map((r,i)=>`${i+1}. ${r.estacion} - ${r.fecha}`).join("\n");
let i=parseInt(prompt(lista))-1;
if(h[i]) mostrarDetalle(h[i]);
}

function mostrarDetalle(d){
let html=`<h3>${d.estacion}</h3><small>${d.fecha}</small><table><tr><th>Producto</th><th>Total</th></tr>`;
d.productos.forEach(p=>html+=`<tr><td>${p.producto}</td><td>${p.total}</td></tr>`);
html+="</table>";
document.getElementById("reporte").innerHTML=html;
}

// 🧮 CALCULADORA
let inputActivo=null;

document.addEventListener("focusin",e=>{
if(e.target.classList.contains("val")) inputActivo=e.target;
});

function abrirCalculadora(){calcVentana.style.display="block";}
function cerrarCalculadora(){calcVentana.style.display="none";}
function calc(v){calcDisplay.value+=v;}
function calcularResultado(){try{calcDisplay.value=eval(calcDisplay.value);}catch{alert("Error");}}
function insertarResultado(){
if(!inputActivo)return alert("Selecciona celda");
inputActivo.value=calcDisplay.value;
inputActivo.dispatchEvent(new Event("change"));
cerrarCalculadora();
}
function limpiarCalc(){calcDisplay.value="";}
function borrarUltimo(){calcDisplay.value=calcDisplay.value.slice(0,-1);}

// MOVER VENTANA
let calcVentana=document.getElementById("calcVentana");
let calcHeader=document.getElementById("calcHeader");
let x=0,y=0,drag=false;

calcHeader.onmousedown=e=>{drag=true;x=calcVentana.offsetLeft-e.clientX;y=calcVentana.offsetTop-e.clientY;}
document.onmouseup=()=>drag=false;
document.onmousemove=e=>{if(drag){calcVentana.style.left=(e.clientX+x)+"px";calcVentana.style.top=(e.clientY+y)+"px";}};

// INICIO
document.addEventListener("DOMContentLoaded",()=>{crearTabla();cargarTemporal();});

</script>

</body>
</html>
